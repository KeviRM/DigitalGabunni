server {
    listen 80;
    server_name gabunny.agenciakeops.com;
    charset utf-8;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gabunny.agenciakeops.com;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/gabunny.agenciakeops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gabunny.agenciakeops.com/privkey.pem;

    # --- RUTAS DE AUTENTICACIÓN  ---
    location /api/token/ {
        proxy_pass http://auth_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/registro/ {
        proxy_pass http://auth_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/auth/ {
        proxy_pass http://auth_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- OTROS MICROSERVICIOS ---
    location /api/catalogo/ {
        proxy_pass http://catalogo_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/catalogo/ {
        proxy_pass http://catalogo_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/contenido/ {
        proxy_pass http://contenido_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/pedidos/ {
        proxy_pass http://pedidos_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/gestion/ {
        # Enviamos la petición al contenedor de autenticación
        proxy_pass http://auth_service:8000;
        
        # Headers obligatorios para que Django sepa quién es el cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSockets
    location /ws/ {
        proxy_pass http://pedidos_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Estáticos
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}