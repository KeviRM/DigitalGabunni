server {
    # Nginx escucha en el puerto 80 (HTTP estándar)
    listen 80;
    server_name gabunny.agenciakeops.com; # ¡CAMBIA ESTO POR TU DOMINIO REAL!
    charset utf-8;

    # Bloque de configuración para Certbot (Preparación para HTTPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 1. Rutas de API y Backend (Tráfico REST)
    
    # Microservicio AUTH (Rutas /api/auth/)
    location /api/auth/ {
        proxy_pass http://auth_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Microservicio CATÁLOGO (Rutas /api/catalogo/)
    location /api/catalogo/ {
        proxy_pass http://catalogo_service:8000;
        proxy_set_header Host $host;
    }

    # Microservicio CONTENIDO (Puerto 8004/servicio ligero)
    location /api/contenido/ {
        proxy_pass http://contenido_service:8000;
        proxy_set_header Host $host;
    }

    # 2. Rutas del Servicio de Pedidos (HTTP y Webhooks)
    
    # API/Webhooks (El tráfico HTTP de Pedidos)
    location /api/v1/pedidos/ {
        proxy_pass http://pedidos_service:8000;
        proxy_set_header Host $host;
    }

    # 3. Rutas de WebSockets (CRUCIAL para Django Channels)
    
    # Rutas ws://.../ws/
    location /ws/ {
        proxy_pass http://pedidos_service:8000;
        proxy_http_version 1.1;
        # Encabezados necesarios para actualizar la conexión de HTTP a WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 4. Archivos Estáticos y Media (Servido directamente por Nginx para eficiencia)

    # Archivos estáticos de los paneles de administración (Django Admin)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    # Archivos de media (Imágenes subidas por usuarios/admin)
    location /media/ {
        alias /app/media/;
    }

    # 5. Frontend (React PWA - Ruta Raíz)
    
    # Cualquier otra cosa que no sea /api/, /ws/, /static/ o /media/ va al frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}