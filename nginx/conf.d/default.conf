#--- DEFINICIÓNDESERVICIOS(UPSTREAMS)--
#Esto asegura que Nginx encuentre los contenedores por su nombre real
 upstream auth_backend {
 server gabunni_auth:8000;
 }
 upstream catalogo_backend {
 server gabunni_catalogo:8000;
 }
 upstream contenido_backend {
 server gabunni_contenido:8000;
 }
 upstream pedidos_backend {
 server gabunni_pedidos:8000;
 }
 #--- DEFINICIÓNDELSERVIDORLOCAL--
server {
 listen 80;
 server_name localhost;
 charset utf-8;
 #1. FRONTEND(CorriendoentuPC)
 #Si entras a localhost:80, Nginx te mandará a tu frontend local (ej. Vite en puerto 5173)
 location / {
 #'host.docker.internal' es la IP de tu PC vista desde Docker
 proxy_pass http://host.docker.internal:5173;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 }
 #2. RUTASDEAUTENTICACIÓN
 location /api/token/ {
 proxy_pass http://auth_backend;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto http; # Cambiado a http
 }
location /api/registro/ {
 proxy_pass http://auth_backend;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto http;
 }
 location /api/auth/ {
 proxy_pass http://auth_backend;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto http;
 }
 #3. OTROSMICROSERVICIOS
 location /api/catalogo/ {
 proxy_pass http://catalogo_backend;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto http;
 }
 location /api/v1/catalogo/ {
 proxy_pass http://catalogo_backend;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto http;
 }
 location /api/contenido/ {
 proxy_pass http://contenido_backend;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto http;
 }
 location /api/v1/pedidos/ {
 proxy_pass http://pedidos_backend;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto http;
 }
 location /api/gestion/ {
proxy_pass http://auth_backend;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto http;
 }
 #4. WEBSOCKETS(Parapedidosentiemporeal)
 location /ws/ {
 proxy_pass http://pedidos_backend;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto http;
 }
 #5. ARCHIVOSESTÁTICOSYMEDIA
 #Nota: Asegúrate de que los volúmenes estén montados en docker-compose
 location /static/ {
 alias /app/staticfiles/;
 }
 location /media/ {
 alias /app/media/;
 }
 }