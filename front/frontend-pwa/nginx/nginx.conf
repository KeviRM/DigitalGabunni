####Despues


# BLOQUE 1: Tráfico Inseguro (Puerto 80)
# Redirige todo a HTTPS, excepto la validación de Certbot
server {
    listen 80;
    server_name gabunny.agenciakeops.com;
    charset utf-8;

    # Validación de Certbot (¡No borrar!)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirección obligatoria a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# BLOQUE 2: Tráfico Seguro (Puerto 443 SSL)
server {
    listen 443 ssl;
    server_name gabunny.agenciakeops.com;
    charset utf-8;

    # 🔑 LLAVES DE SEGURIDAD (Las que acabamos de crear)
    ssl_certificate /etc/letsencrypt/live/gabunny.agenciakeops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gabunny.agenciakeops.com/privkey.pem;

    # --- TUS RUTAS ORIGINALES ---

    # 1. Microservicios Backend
    location /api/auth/ {
        proxy_pass http://auth_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/catalogo/ {
        proxy_pass http://catalogo_service:8000;
        proxy_set_header Host $host;
    }

    location /api/contenido/ {
        proxy_pass http://contenido_service:8000;
        proxy_set_header Host $host;
    }

    # 2. Pedidos y Webhooks
    location /api/v1/pedidos/ {
        proxy_pass http://pedidos_service:8000;
        proxy_set_header Host $host;
    }

    # 3. WebSockets (Django Channels)
    location /ws/ {
        proxy_pass http://pedidos_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 4. Archivos Estáticos y Media
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
    }

    # 5. Frontend (React PWA)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}